# Tried enabling this (fixed pool, parallelism=2): concurrent scans in the same JVM hit
# java.lang.IllegalStateException: Profiler#stopXXX() can't be called without any message defined
# in start methods, from org.sonar.scanner.log.utils.DefaultProfiler. Unlike the old orchestrator
# (which forked a separate scanner process with its own -Xmx per project), SIT runs the engine
# in-process and reuses its classloader across calls (see ScannerRunner's classloader cache), so
# concurrent scans share the engine's non-thread-safe Profiler state. Leave disabled until the
# engine itself supports concurrent scans.
junit.jupiter.execution.parallel.enabled=false
