name: Authenticate git clones
description: >
  Configure git so that clone/fetch requests against github.com are authenticated and
  therefore not subject to GitHub's anonymous rate limits.

inputs:
  gh-token:
    description: Token used to authenticate git operations against github.com.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
      run: |
        set -euo pipefail
        gh auth setup-git --hostname github.com
        # Authenticate on the first request instead of waiting for a 401. GitHub throttles
        # anonymous requests without issuing an auth challenge, so lazy authentication never
        # kicks in and the clone fails instead of being retried with credentials.
        git config --global http.proactiveAuth auto
