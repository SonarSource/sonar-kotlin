name: Build
on:
  push:
    branches:
      - master
      - branch-*
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *" # at 02:00 UTC every day

concurrency:
  # Master runs are keyed by commit and never cancelled, so each push gets its performance validation
  # triggered, even while the trigger job waits for the previous push's build.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref_name == github.event.repository.default_branch && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

permissions:
  id-token: write  # Required for Vault OIDC authentication
  contents: read

jobs:
  build:
    runs-on: github-ubuntu-latest-s
    timeout-minutes: 30
    permissions:
      id-token: write  # Required for Vault OIDC authentication
      contents: write  # Required by get-build-number to claim refs/build-number/*
    outputs:
      project-version: ${{ steps.project-version.outputs.project-version }}
    steps:
      - &configure_GITHUB_JOB_ID_environment_variable
        # https://github.com/actions/runner/issues/324#issuecomment-3324382354
        # for Develocity
        run: echo "GITHUB_JOB_ID=${{ job.check_run_id }}" >> $GITHUB_ENV
        shell: bash
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - &checkout-build-logic
        name: Checkout build logic
        uses: ./.github/actions/checkout-build-logic
        with:
          gh-token: ${{ github.token }}
      - &setup-mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
      - id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/kv/data/develocity token | DEVELOCITY_TOKEN;
            development/kv/data/next token | SONAR_TOKEN;
            development/kv/data/sign key | SIGN_KEY;
            development/kv/data/sign passphrase | SIGN_PASSPHRASE;
            development/kv/data/sign key_id | SIGN_KEY_ID;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader username | ARTIFACTORY_USERNAME;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-qa-deployer username | ARTIFACTORY_DEPLOY_USERNAME;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-qa-deployer access_token | ARTIFACTORY_DEPLOY_PASSWORD;
      - id: build-number
        uses: SonarSource/ci-github-actions/get-build-number@v2
      - run: |
          ./gradlew \
              build \
              sonar -Dsonar.host.url=https://next.sonarqube.com/sonarqube \
              artifactoryPublish \
              -DbuildNumber=${{ steps.build-number.outputs.BUILD_NUMBER }}
        env:
          DEVELOCITY_ACCESS_KEY: develocity-public.sonar.build=${{ fromJSON(steps.secrets.outputs.vault).DEVELOCITY_TOKEN }}
          SONAR_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).SONAR_TOKEN }}
          ORG_GRADLE_PROJECT_signingKey: ${{ fromJSON(steps.secrets.outputs.vault).SIGN_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ fromJSON(steps.secrets.outputs.vault).SIGN_PASSPHRASE }}
          ORG_GRADLE_PROJECT_signingKeyId: ${{ fromJSON(steps.secrets.outputs.vault).SIGN_KEY_ID }}
          ARTIFACTORY_URL: https://repox.jfrog.io/artifactory
          ARTIFACTORY_USERNAME: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_USERNAME }}
          ARTIFACTORY_ACCESS_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
          ARTIFACTORY_DEPLOY_REPO: sonarsource-public-qa
          ARTIFACTORY_DEPLOY_USERNAME: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_DEPLOY_USERNAME }}
          ARTIFACTORY_DEPLOY_PASSWORD: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_DEPLOY_PASSWORD }}
      - name: Get project version
        id: project-version
        run: |
          set -euo pipefail
          VERSION=$(./gradlew properties --no-scan --no-daemon --console plain \
            -DbuildNumber=${{ steps.build-number.outputs.BUILD_NUMBER }} \
            | grep '^version:' | awk '{print $2}')
          if [ -z "$VERSION" ]; then
            echo "::error::Failed to determine project version from './gradlew properties' output"
            exit 1
          fi
          echo "project-version=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          ARTIFACTORY_PRIVATE_USERNAME: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_USERNAME }}
          ARTIFACTORY_PRIVATE_PASSWORD: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}

  # Records the deployed plugin version as the candidate-version artifact, read by the /pvf trigger
  # (pvf-comment.yml) and as the baseline of the next master push's performance validation. A job of
  # its own, so that a failure here cannot fail the build or the promotion.
  prepare_pvf:
    name: Prepare PVF
    needs: [build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: github-ubuntu-latest-s
    timeout-minutes: 5
    steps:
      - uses: SonarSource/core-languages-tooling-public/prepare-pvf@master
        with:
          build-version: ${{ needs.build.outputs.project-version }}

  qa_plugin:
    runs-on: github-ubuntu-latest-s
    timeout-minutes: 30
    steps:
      - *configure_GITHUB_JOB_ID_environment_variable
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - *checkout-build-logic
      - *setup-mise
      - id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/kv/data/develocity token | DEVELOCITY_TOKEN;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader username | ARTIFACTORY_USERNAME;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;
            development/github/token/licenses-ro token | GITHUB_TOKEN;
      - uses: ./.github/actions/cache-orchestrator
      - run: |
          ./gradlew \
              :its:plugin:integrationTest --info
        env:
          DEVELOCITY_ACCESS_KEY: develocity-public.sonar.build=${{ fromJSON(steps.secrets.outputs.vault).DEVELOCITY_TOKEN }}
          ARTIFACTORY_PRIVATE_USERNAME: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_USERNAME }}
          ARTIFACTORY_PRIVATE_PASSWORD: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
          ARTIFACTORY_ACCESS_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).GITHUB_TOKEN }}
  qa_ruling:
    runs-on: github-ubuntu-latest-m
    timeout-minutes: 60
    outputs:
      ruling-outcome: ${{ steps.ruling.outcome }}
    steps:
      - *configure_GITHUB_JOB_ID_environment_variable
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - *setup-mise
      - id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/kv/data/develocity token | DEVELOCITY_TOKEN;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader username | ARTIFACTORY_USERNAME;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;
      - id: ruling
        run: |
          ./gradlew \
              :its:ruling:integrationTest --info
        env:
          KOTLIN_COMPILER_IT_ENABLED: true
          DEVELOCITY_ACCESS_KEY: develocity-public.sonar.build=${{ fromJSON(steps.secrets.outputs.vault).DEVELOCITY_TOKEN }}
          ARTIFACTORY_PRIVATE_USERNAME: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_USERNAME }}
          ARTIFACTORY_PRIVATE_PASSWORD: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
          ARTIFACTORY_ACCESS_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
      # Upload the actual results written to its/ruling/build/actual, consumed by ruling_update_notify
      # to open a PR updating the expected files.
      - name: Prepare ruling artifact
        if: ${{ always() && steps.ruling.outcome == 'failure' }}
        uses: SonarSource/core-languages-tooling-public/prepare-ruling-artifact@a04d15c9fe09880db6870b01875e184ed57ca242
  ruling_update_notify:
    name: Ruling Update and Notify
    needs: [qa_ruling]
    # qa_ruling itself still fails on ruling differences, so run whenever the ruling step completed;
    # when ruling passes, this closes any stale fix PR. Fork PRs get a read-only token, skip them.
    if: >-
      always() && !cancelled() &&
      contains(fromJSON('["success", "failure"]'), needs.qa_ruling.outputs.ruling-outcome) &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: github-ubuntu-latest-s
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Update ruling and notify
        uses: SonarSource/core-languages-tooling-public/ruling-update-and-notify@a04d15c9fe09880db6870b01875e184ed57ca242
        with:
          ruling-failed: ${{ needs.qa_ruling.outputs.ruling-outcome == 'failure' }}
  qa_sq_integration:
    runs-on: github-ubuntu-latest-m
    timeout-minutes: 30
    steps:
      - *configure_GITHUB_JOB_ID_environment_variable
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - *setup-mise
      - id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/kv/data/develocity token | DEVELOCITY_TOKEN;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader username | ARTIFACTORY_USERNAME;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;
            development/github/token/licenses-ro token | GITHUB_TOKEN;
      - uses: ./.github/actions/cache-orchestrator
      - run: |
          ./gradlew \
              :its:sq-integration:integrationTest --info -Dsonar.runtimeVersion=DEV
        env:
          DEVELOCITY_ACCESS_KEY: develocity-public.sonar.build=${{ fromJSON(steps.secrets.outputs.vault).DEVELOCITY_TOKEN }}
          ARTIFACTORY_PRIVATE_USERNAME: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_USERNAME }}
          ARTIFACTORY_PRIVATE_PASSWORD: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
          ARTIFACTORY_ACCESS_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).GITHUB_TOKEN }}
  # Public repos cannot call private reusable workflows (GitHub limitation).
  # On every push to master, trigger PVF in private sonar-kotlin-pvf via repository_dispatch,
  # benchmarking the pushed plugin against the previous master commit's one; results are reported
  # back as the `performance-validation` commit status, and on a regression or error as a comment on
  # the merged PR. A merged PR with the skip-pvf label or [skip pvf] in its title skips it. On PRs,
  # PVF runs on demand by commenting /pvf (see pvf-comment.yml).
  trigger_performance_validation:
    name: Trigger Performance Validation
    needs: [build]
    if: >-
      github.event_name == 'push' &&
      github.ref_name == github.event.repository.default_branch &&
      !cancelled() &&
      needs.build.result == 'success'
    runs-on: github-ubuntu-latest-s
    # Waits up to 45 minutes for the previous commit's Build run to record its plugin version.
    timeout-minutes: 60
    permissions:
      id-token: write
      statuses: write
      actions: read
      contents: read
      pull-requests: write
    steps:
      # The dashboard shows master-push runs with the generic "manual" badge, so the description is
      # what identifies the validated commit.
      - name: Describe the master push
        id: describe
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # "<sha> <subject> (#<PR>)", from the subject line of the pushed commit.
          subject="${MESSAGE%%$'\n'*}"
          # On an HTTP error gh prints the error body on stdout, so the output is only used on success.
          # The merged PR's number replaces the " (#<PR>)" suffix a squash merge adds, so it isn't
          # repeated; without it, the subject is kept as it is.
          if pr="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" --jq '[.[] | select(.merged_at != null)][0].number // empty' 2>/dev/null)" \
            && [[ -n "$pr" ]]; then
            subject="$(sed -E 's/ \(#[0-9]+\)$//' <<<"$subject") (#${pr})"
          fi
          echo "run-description=${SHA:0:10} ${subject}" >> "$GITHUB_OUTPUT"
      # Resolved here rather than in sonar-kotlin-pvf, which cannot read this repository's artifacts.
      - name: Resolve the previous master build's plugin version
        id: baseline
        uses: SonarSource/core-languages-tooling-public/pvf-resolve-baseline@master
        with:
          previous-sha: ${{ github.event.before }}
          # The job that records the plugin version.
          publication-job: Prepare PVF
          # Rule metadata and docs.
          skip-paths: '(^|/)src/main/resources/(org|com)/sonar/l10n/[^/]+/rules/|sonarpedia\.json$|\.md$'
      - id: secrets
        if: steps.baseline.outputs.baseline-version != ''
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/github/token/{REPO_OWNER_NAME_DASH}-pvf-trigger token | GITHUB_TOKEN;
      - name: Set pending status
        if: steps.baseline.outputs.baseline-version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context=performance-validation \
            -f description="PVF triggered" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Dispatch PVF on sonar-kotlin-pvf
        if: steps.baseline.outputs.baseline-version != ''
        id: dispatch
        env:
          GH_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).GITHUB_TOKEN }}
          BASELINE: ${{ steps.baseline.outputs.baseline-version }}
          BASELINE_SHA: ${{ steps.baseline.outputs.baseline-sha }}
          PREVIOUS_SHA: ${{ github.event.before }}
          CANDIDATE: ${{ needs.build.outputs.project-version }}
          RUN_DESCRIPTION: ${{ steps.describe.outputs.run-description }}
        run: |
          set -euo pipefail
          gh api repos/SonarSource/sonar-kotlin-pvf/dispatches \
            --method POST \
            -f event_type=sonar-kotlin-pr-pvf \
            -f "client_payload[baseline-version]=${BASELINE}" \
            -f "client_payload[baseline-sha]=${BASELINE_SHA}" \
            -f "client_payload[previous-sha]=${PREVIOUS_SHA}" \
            -f "client_payload[candidate-version]=${CANDIDATE}" \
            -f "client_payload[commit-sha]=${GITHUB_SHA}" \
            -f "client_payload[source-repo]=${GITHUB_REPOSITORY}" \
            -f "client_payload[run-description]=${RUN_DESCRIPTION}"
      - name: Mark status error if dispatch failed
        if: failure() && steps.baseline.outputs.baseline-version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=error \
            -f context=performance-validation \
            -f description="Failed to trigger PVF" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Notify the merger that the baseline could not be resolved
        if: failure() && steps.baseline.outcome == 'failure'
        uses: SonarSource/core-languages-tooling-public/pvf-notify-merger@master
        with:
          merged-sha: ${{ github.sha }}
          previous-sha: ${{ github.event.before }}
          baseline-version: not resolved
          candidate-version: ${{ needs.build.outputs.project-version }}
          failed-jobs: Trigger Performance Validation

  promote:
    needs:
      - build
      - qa_plugin
      - qa_ruling
      - qa_sq_integration
    runs-on: github-ubuntu-latest-s
    timeout-minutes: 10
    permissions:
      id-token: write  # Required for Vault OIDC authentication
      contents: write
    # without following condition this job can have result "skipped" if needed job "failed" or "skipped"
    # auto-merge ignores skipped jobs even if they are required by branch protection rules
    if: ${{ always() && !cancelled() }}
    steps:
      - name: Check results of all needed jobs
        run: |
          R=$(echo "$NEEDS" | jq --compact-output '[.[].result] | unique')
          if [ "$R" = '["success"]' ]; then
            exit 0
          else
            exit 1
          fi
        env:
          NEEDS: ${{ toJSON(needs) }}
      - uses: SonarSource/ci-github-actions/promote@v2

  notify_slack:
    name: Notify Slack on Failure
    needs: [ build, qa_plugin, qa_ruling, qa_sq_integration, promote ]
    if: >-
      failure() && ! cancelled() &&
      (github.ref_name == github.event.repository.default_branch ||
      startsWith(github.ref_name, 'branch-') ||
      startsWith(github.ref_name, 'feature/'))
    permissions:
      id-token: write
      statuses: read
    runs-on: github-ubuntu-latest-s
    timeout-minutes: 10
    steps:
      - uses: SonarSource/release-github-actions/notify-slack@v1
        with:
          project-name: "SonarKotlin"
          slack-channel: "squad-security-cloud-notifs"
          icon: ':kotlin:'
          jobs: ${{ toJSON(needs) }}
