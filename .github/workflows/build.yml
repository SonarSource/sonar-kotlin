name: Build
on:
  push:
    branches:
      - master
      - branch-*
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *" # at 02:00 UTC every day

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write  # Required for Vault OIDC authentication
  contents: read

jobs:
  build:
    runs-on: github-ubuntu-latest-s
    timeout-minutes: 30
    outputs:
      project-version: ${{ steps.project-version.outputs.project-version }}
    steps:
      - &configure_GITHUB_JOB_ID_environment_variable
        # https://github.com/actions/runner/issues/324#issuecomment-3324382354
        # for Develocity
        run: echo "GITHUB_JOB_ID=${{ job.check_run_id }}" >> $GITHUB_ENV
        shell: bash
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - &checkout-build-logic
        id: checkout-build-logic
        run: git submodule update --init -- build-logic/common
      - &setup-mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.2.24
      - id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/kv/data/develocity token | DEVELOCITY_TOKEN;
            development/kv/data/next token | SONAR_TOKEN;
            development/kv/data/sign key | SIGN_KEY;
            development/kv/data/sign passphrase | SIGN_PASSPHRASE;
            development/kv/data/sign key_id | SIGN_KEY_ID;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader username | ARTIFACTORY_USERNAME;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-qa-deployer username | ARTIFACTORY_DEPLOY_USERNAME;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-qa-deployer access_token | ARTIFACTORY_DEPLOY_PASSWORD;
      - id: build-number
        uses: SonarSource/ci-github-actions/get-build-number@v1
      - run: |
          ./gradlew \
              build \
              sonar -Dsonar.host.url=https://next.sonarqube.com/sonarqube \
              artifactoryPublish \
              -DbuildNumber=${{ steps.build-number.outputs.BUILD_NUMBER }}
        env:
          DEVELOCITY_ACCESS_KEY: develocity-public.sonar.build=${{ fromJSON(steps.secrets.outputs.vault).DEVELOCITY_TOKEN }}
          SONAR_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).SONAR_TOKEN }}
          ORG_GRADLE_PROJECT_signingKey: ${{ fromJSON(steps.secrets.outputs.vault).SIGN_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ fromJSON(steps.secrets.outputs.vault).SIGN_PASSPHRASE }}
          ORG_GRADLE_PROJECT_signingKeyId: ${{ fromJSON(steps.secrets.outputs.vault).SIGN_KEY_ID }}
          ARTIFACTORY_URL: https://repox.jfrog.io/artifactory
          ARTIFACTORY_USERNAME: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_USERNAME }}
          ARTIFACTORY_ACCESS_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
          ARTIFACTORY_DEPLOY_REPO: sonarsource-public-qa
          ARTIFACTORY_DEPLOY_USERNAME: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_DEPLOY_USERNAME }}
          ARTIFACTORY_DEPLOY_PASSWORD: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_DEPLOY_PASSWORD }}
      - name: Get project version
        id: project-version
        run: |
          set -euo pipefail
          VERSION=$(./gradlew properties --no-scan --no-daemon --console plain \
            -DbuildNumber=${{ steps.build-number.outputs.BUILD_NUMBER }} \
            | grep '^version:' | awk '{print $2}')
          if [ -z "$VERSION" ]; then
            echo "::error::Failed to determine project version from './gradlew properties' output"
            exit 1
          fi
          echo "project-version=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          ARTIFACTORY_PRIVATE_USERNAME: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_USERNAME }}
          ARTIFACTORY_PRIVATE_PASSWORD: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}

  qa_plugin:
    runs-on: github-ubuntu-latest-s
    timeout-minutes: 30
    steps:
      - *configure_GITHUB_JOB_ID_environment_variable
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - *checkout-build-logic
      - *setup-mise
      - id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/kv/data/develocity token | DEVELOCITY_TOKEN;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader username | ARTIFACTORY_USERNAME;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;
            development/github/token/licenses-ro token | GITHUB_TOKEN;
      - uses: ./.github/actions/cache-orchestrator
      - run: |
          ./gradlew \
              :its:plugin:integrationTest --info -Pits
        env:
          DEVELOCITY_ACCESS_KEY: develocity-public.sonar.build=${{ fromJSON(steps.secrets.outputs.vault).DEVELOCITY_TOKEN }}
          ARTIFACTORY_PRIVATE_USERNAME: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_USERNAME }}
          ARTIFACTORY_PRIVATE_PASSWORD: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
          ARTIFACTORY_ACCESS_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).GITHUB_TOKEN }}
  qa_ruling:
    runs-on: github-ubuntu-latest-m
    timeout-minutes: 60
    steps:
      - *configure_GITHUB_JOB_ID_environment_variable
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
      - *setup-mise
      - id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/kv/data/develocity token | DEVELOCITY_TOKEN;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader username | ARTIFACTORY_USERNAME;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;
      - run: |
          ./gradlew \
              :its:ruling:integrationTest --info -Pruling
        env:
          KOTLIN_COMPILER_IT_ENABLED: true
          DEVELOCITY_ACCESS_KEY: develocity-public.sonar.build=${{ fromJSON(steps.secrets.outputs.vault).DEVELOCITY_TOKEN }}
          ARTIFACTORY_PRIVATE_USERNAME: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_USERNAME }}
          ARTIFACTORY_PRIVATE_PASSWORD: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
          ARTIFACTORY_ACCESS_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
  qa_sq_integration:
    runs-on: github-ubuntu-latest-m
    timeout-minutes: 30
    steps:
      - *configure_GITHUB_JOB_ID_environment_variable
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
      - *setup-mise
      - id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/kv/data/develocity token | DEVELOCITY_TOKEN;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader username | ARTIFACTORY_USERNAME;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;
            development/github/token/licenses-ro token | GITHUB_TOKEN;
      - uses: ./.github/actions/cache-orchestrator
      - run: |
          ./gradlew \
              :its:sq-integration:integrationTest --info -Pits -Dsonar.runtimeVersion=DEV
        env:
          DEVELOCITY_ACCESS_KEY: develocity-public.sonar.build=${{ fromJSON(steps.secrets.outputs.vault).DEVELOCITY_TOKEN }}
          ARTIFACTORY_PRIVATE_USERNAME: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_USERNAME }}
          ARTIFACTORY_PRIVATE_PASSWORD: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
          ARTIFACTORY_ACCESS_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).GITHUB_TOKEN }}
  # Public repos cannot call private reusable workflows (GitHub limitation).
  # Trigger PVF in private sonar-kotlin-pvf via repository_dispatch; results are
  # reported back as the `performance-validation` commit status.
  trigger_performance_validation:
    name: Trigger Performance Validation
    needs: [build]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !cancelled() &&
      needs.build.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(github.event.pull_request.labels.*.name, 'skip-pvf') &&
      !contains(github.event.pull_request.title, '[skip pvf]')
    runs-on: github-ubuntu-latest-s
    timeout-minutes: 10
    permissions:
      id-token: write
      statuses: write
    steps:
      - id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/github/token/{REPO_OWNER_NAME_DASH}-pvf-trigger token | GITHUB_TOKEN;
      - name: Set pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state=pending \
            -f context=performance-validation \
            -f description="PVF triggered" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Dispatch PVF on sonar-kotlin-pvf
        id: dispatch
        env:
          GH_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).GITHUB_TOKEN }}
          CANDIDATE: ${{ needs.build.outputs.project-version }}
        run: |
          set -euo pipefail
          gh api repos/SonarSource/sonar-kotlin-pvf/dispatches \
            --method POST \
            -f event_type=sonar-kotlin-pr-pvf \
            -f "client_payload[baseline-version]=DEV" \
            -f "client_payload[candidate-version]=${CANDIDATE}" \
            -f "client_payload[scannerDebug]=${{ contains(github.event.pull_request.labels.*.name, 'pvf-debug') }}" \
            -f "client_payload[commit-sha]=${{ github.event.pull_request.head.sha }}" \
            -f "client_payload[pr-number]=${{ github.event.pull_request.number }}" \
            -f "client_payload[source-repo]=${{ github.repository }}"
      - name: Mark status error if dispatch failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state=error \
            -f context=performance-validation \
            -f description="Failed to trigger PVF" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  promote:
    needs:
      - build
      - qa_plugin
      - qa_ruling
      - qa_sq_integration
    runs-on: github-ubuntu-latest-s
    timeout-minutes: 10
    permissions:
      id-token: write  # Required for Vault OIDC authentication
      contents: write
    # without following condition this job can have result "skipped" if needed job "failed" or "skipped"
    # auto-merge ignores skipped jobs even if they are required by branch protection rules
    if: ${{ always() && !cancelled() }}
    steps:
      - name: Check results of all needed jobs
        run: |
          R=$(echo "$NEEDS" | jq --compact-output '[.[].result] | unique')
          if [ "$R" = '["success"]' ]; then
            exit 0
          else
            exit 1
          fi
        env:
          NEEDS: ${{ toJSON(needs) }}
      - uses: SonarSource/ci-github-actions/promote@v1

  notify_slack:
    name: Notify Slack on Failure
    needs: [ build, qa_plugin, qa_ruling, qa_sq_integration, promote ]
    if: >-
      failure() && ! cancelled() &&
      (github.ref_name == github.event.repository.default_branch ||
      startsWith(github.ref_name, 'branch-') ||
      startsWith(github.ref_name, 'feature/'))
    permissions:
      id-token: write
      statuses: read
    runs-on: github-ubuntu-latest-s
    timeout-minutes: 10
    steps:
      - uses: SonarSource/release-github-actions/notify-slack@v1
        with:
          project-name: "SonarKotlin"
          slack-channel: "squad-security-cloud-notifs"
          icon: ':kotlin:'
          jobs: ${{ toJSON(needs) }}
